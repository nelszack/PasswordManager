version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # cosmic-text pins skrifa 0.37; swash accepts 0.31-0.44. Moving skrifa
      # alone would build a second skrifa/read-fonts/font-types stack. Bump it
      # together with cosmic-text (and check `cargo tree -d`) instead.
      - dependency-name: skrifa
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Etc/UTC
    groups:
      browser-test-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Etc/UTC
    groups:
      fuzz-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
