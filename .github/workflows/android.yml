name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      # The desktop GUI belongs to the pm binary (src/main.rs), not the library
      # pm-mobile links with default features off, so it cannot reach the APK.
      - '!src/gui/**'
      - '!src/desktop.rs'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/build_android.py'
      - 'scripts/android_instrumentation.sh'
      - '.github/workflows/android.yml'
      - '.github/actions/rust-toolchain/**'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - '!src/gui/**'
      - '!src/desktop.rs'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/build_android.py'
      - 'scripts/android_instrumentation.sh'
      - '.github/workflows/android.yml'
      - '.github/actions/rust-toolchain/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.run_id }}
  # Preserve checks for earlier direct pushes; PR updates may cancel old PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Install Gradle
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  '"$RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-8.13/bin/gradle" >> "$GITHUB_ENV"
      - name: Restore Gradle dependency cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Downloaded dependencies and transformed jars only; build outputs
          # and the configuration cache stay per run.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/jars-9
          key: gradle-v1-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-v1-
      - name: Build APK, unit tests, and lint
        run: python3 scripts/build_android.py
      - name: Build instrumentation test APK
        # Same job and debug key as the app APK, so both install together.
        run: '"$GRADLE" -p android --console=plain :app:assembleDebugAndroidTest'
      - name: Save Gradle dependency cache
        # Main refreshes the shared cache; pull requests only restore it.
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/jars-9
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Collect APKs for the emulator job
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-apks
          path: apks/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: android-reports
          path: android/app/build/reports/

  # Instrumentation tests on an isolated emulator: each class in its own process,
  # including the emulator-only integration test, plus light/dark screenshots.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-test-apks
          path: apks
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Android 14+: the credential provider and inline autofill suggestions.
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android_instrumentation.sh apks android-instrumentation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-instrumentation
          path: android-instrumentation/
          if-no-files-found: ignore
