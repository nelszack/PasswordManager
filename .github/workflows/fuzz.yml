name: Security fuzzing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.run_id }}
  # Preserve checks for earlier direct pushes; PR updates may cancel old PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      extension: ${{ steps.plan.outputs.extension }}
      browser: ${{ steps.plan.outputs.browser }}
      cloud: ${{ steps.plan.outputs.cloud }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      rust_audit: ${{ steps.plan.outputs.rust_audit }}
      npm_audit: ${{ steps.plan.outputs.npm_audit }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The planner diffs the PR test merge against its first parent (or a
          # push's endpoints, fetching a missing one by ID): no history needed.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            scripts/ci
      - uses: ./.github/actions/plan-checks
        id: plan
        with:
          workflow: fuzz
          token: ${{ github.token }}

  fuzz:
    needs: plan
    if: needs.plan.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Sanitizer instrumentation needs nightly. The variable overrides the
      # stable pin in rust-toolchain.toml for every rustup-proxied command,
      # including the cargo invocations cargo-fuzz makes.
      # The 2026-11-01 nightly fails to compile zbus (async-drop cycle).
      # https://github.com/rust-lang/rust/issues/165263
      RUSTUP_TOOLCHAIN: nightly-2026-10-31
    strategy:
      fail-fast: false
      matrix:
        target: [encrypted_headers, native_messages, imports]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # toolchain installer
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz -> target
          # All targets use the same instrumented dependencies. One main job
          # populates the cache; PRs and the other targets only restore it.
          shared-key: fuzz-dependencies
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target == 'encrypted_headers' }}
      - name: Restore fuzz corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # Fresh keys retain new inputs on main and within each isolated PR.
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-${{ matrix.target }}-
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
          # Not in install-action's own manifest: cargo-binstall fetches the
          # rust-fuzz/cargo-fuzz release binary instead of compiling per leg.
          fallback: cargo-binstall
      - name: Verify fuzz dependency lockfile
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Seed corpus
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$FUZZ_TARGET"
          cp "fuzz/seeds/$FUZZ_TARGET/"* "fuzz/corpus/$FUZZ_TARGET/"
      - name: Run coverage-guided fuzzing
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_EVENT: ${{ github.event_name }}
        run: |
          seconds=60
          if [ "$FUZZ_EVENT" = schedule ] || [ "$FUZZ_EVENT" = workflow_dispatch ]; then seconds=600; fi
          cargo fuzz run "$FUZZ_TARGET" -- -max_total_time="$seconds" -max_len=65536 -rss_limit_mb=2048
      - name: Save fuzz corpus
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  result:
    name: Fuzz result
    if: always()
    needs: [plan, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tree ID still covers the whole commit.
          sparse-checkout: |
            .github
            scripts/ci
      - uses: ./.github/actions/finish-checks
        with:
          workflow: fuzz
          results: ${{ toJSON(needs) }}
          selected: ${{ toJSON(needs.plan.outputs) }}
