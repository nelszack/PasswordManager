name: Security fuzzing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.run_id }}
  # Preserve checks for earlier direct pushes; PR updates may cancel old PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      extension: ${{ steps.plan.outputs.extension }}
      browser: ${{ steps.plan.outputs.browser }}
      cloud: ${{ steps.plan.outputs.cloud }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      rust_audit: ${{ steps.plan.outputs.rust_audit }}
      npm_audit: ${{ steps.plan.outputs.npm_audit }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test CI selection and reuse safeguards
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Select suites or reuse successful PR result
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/plan.py --workflow fuzz

  fuzz:
    needs: plan
    if: needs.plan.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [encrypted_headers, native_messages, imports]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # toolchain installer
        with:
          # The 2026-11-01 nightly fails to compile zbus (async-drop cycle).
          # https://github.com/rust-lang/rust/issues/165263
          toolchain: nightly-2026-10-31
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz -> target
          # All targets use the same instrumented dependencies. One main job
          # populates the cache; PRs and the other targets only restore it.
          shared-key: fuzz-dependencies
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target == 'encrypted_headers' }}
      - name: Restore fuzz corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # Fresh keys retain new inputs on main and within each isolated PR.
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-${{ matrix.target }}-
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Verify fuzz dependency lockfile
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Seed corpus
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$FUZZ_TARGET"
          cp "fuzz/seeds/$FUZZ_TARGET/"* "fuzz/corpus/$FUZZ_TARGET/"
      - name: Run coverage-guided fuzzing
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_EVENT: ${{ github.event_name }}
        run: |
          seconds=60
          if [ "$FUZZ_EVENT" = schedule ] || [ "$FUZZ_EVENT" = workflow_dispatch ]; then seconds=600; fi
          cargo fuzz run "$FUZZ_TARGET" -- -max_total_time="$seconds" -max_len=65536 -rss_limit_mb=2048
      - name: Save fuzz corpus
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  result:
    name: Fuzz result
    if: always()
    needs: [plan, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/plan.py --workflow fuzz --finish
      - name: Record the tested source tree
        env:
          SELECTED: ${{ toJSON(needs.plan.outputs) }}
        run: python3 scripts/ci/plan.py --workflow fuzz --record
      - name: Upload successful source-tree proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-tested-tree
          path: tested-tree.json
          overwrite: true
          retention-days: 14
          if-no-files-found: error
