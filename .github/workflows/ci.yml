name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Verify generated command reference
        run: cargo run --locked -- generate-command-reference --check
      - name: Validate browser extension sources
        run: |
          node --check extension/background.js
          node --check extension/background_security.js
          node --check extension/background_state.js
          node --check extension/credential_prompt.js
          node --check extension/credential_prompt_state.js
          node --check extension/content_detection.js
          node --check extension/form_submission.js
          node --check extension/native_protocol.js
          node --check extension/pending_credentials.js
          node --check extension/relay.js
          node --check extension/content.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
          node --test extension/*.test.js
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  mac-architectures:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check release target
        run: cargo check --release --locked --target ${{ matrix.target }}

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build native host and server
        run: cargo build --locked
      - name: Run browser end-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e:coverage
      - name: Upload browser coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-coverage
          path: test-results/e2e-coverage/
          if-no-files-found: error
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  coverage:
    name: Coverage baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          # --test-coverage-include-all requires Node 26.7 or newer.
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Measure Rust coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path rust-lcov.info --fail-under-lines 65
      - name: Measure extension unit coverage
        run: npm run test:extension:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: rust-lcov.info
          if-no-files-found: error
