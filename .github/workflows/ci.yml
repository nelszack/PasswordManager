name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Full runs refresh shared main-branch Rust caches and catch selection gaps.
  schedule:
    - cron: "11 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # Preserve checks for earlier direct pushes; PR updates may cancel old PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      extension: ${{ steps.plan.outputs.extension }}
      browser: ${{ steps.plan.outputs.browser }}
      cloud: ${{ steps.plan.outputs.cloud }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      rust_audit: ${{ steps.plan.outputs.rust_audit }}
      npm_audit: ${{ steps.plan.outputs.npm_audit }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The planner diffs the PR test merge against its first parent (or a
          # push's endpoints, fetching a missing one by ID): no history needed.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            scripts/ci
      - uses: ./.github/actions/plan-checks
        id: plan
        with:
          workflow: ci
          token: ${{ github.token }}

  test:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - uses: ./.github/actions/rust-toolchain
        with:
          # The Apple Silicon runner also checks the Intel macOS target.
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Scheduled/manual main runs refresh shared caches; PRs only restore.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Install coverage runner
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
      - name: Validate release sources
        env:
          # Linux runs the Rust tests instrumented, enforcing the coverage gate
          # without a second build and test run.
          PM_RUST_COVERAGE_LCOV: ${{ runner.os == 'Linux' && 'rust-lcov.info' || '' }}
        run: npm run validate -- rust
      - name: Upload Rust coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-reports
          path: rust-lcov.info
          if-no-files-found: error
      - name: Check CLI-only build
        run: cargo check --locked --no-default-features --all-targets
      - name: Check Intel macOS target
        if: runner.os == 'macOS'
        # Debug profile: reuses this job's host proc-macros and build scripts.
        run: cargo check --locked --target x86_64-apple-darwin

  extension:
    name: Extension unit tests and generated bundles
    needs: plan
    if: needs.plan.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run validate -- extension

  # Cloud sync and browser integration both run the same CLI-only debug binary.
  cli-build:
    needs: plan
    if: needs.plan.outputs.cloud == 'true' || needs.plan.outputs.browser == 'true'
    name: Build CLI client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build CLI client and native host
        run: cargo build --locked --no-default-features
      - name: Bundle executable
        # Artifacts drop permission bits; the tarball keeps pm executable.
        run: tar -cf pm-cli.tar -C target/debug pm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pm-cli
          path: pm-cli.tar
          retention-days: 1
          if-no-files-found: error

  cloud-sync:
    needs: [plan, cli-build]
    if: needs.plan.outputs.cloud == 'true'
    name: Cloud sync server and two-device integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sync-server/go.mod
          cache: false
      - name: Validate Go server
        working-directory: sync-server
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pm-cli
      - name: Restore CLI client
        run: mkdir -p target/debug && tar -xf pm-cli.tar -C target/debug && rm pm-cli.tar
      - name: Exercise two independent devices
        run: python3 scripts/test_cloud_sync.py

  browser-e2e:
    needs: [plan, cli-build]
    if: needs.plan.outputs.browser == 'true'
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pm-cli
      - name: Restore native host and server
        # The real-stack tests require target/debug/pm and skip without it.
        run: |
          mkdir -p target/debug && tar -xf pm-cli.tar -C target/debug && rm pm-cli.tar
          test -x target/debug/pm
      - name: Run browser end-to-end tests
        run: npm run test:e2e:coverage
      - name: Upload browser coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-coverage
          path: test-results/e2e-coverage/
          if-no-files-found: error
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  result:
    name: CI result
    if: always()
    needs: [plan, test, extension, cli-build, cloud-sync, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tree ID still covers the whole commit.
          sparse-checkout: |
            .github
            scripts/ci
      - uses: ./.github/actions/finish-checks
        with:
          workflow: ci
          results: ${{ toJSON(needs) }}
          selected: ${{ toJSON(needs.plan.outputs) }}
