name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  # Preserve checks for earlier direct pushes; PR updates may cancel old PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      extension: ${{ steps.plan.outputs.extension }}
      browser: ${{ steps.plan.outputs.browser }}
      cloud: ${{ steps.plan.outputs.cloud }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      rust_audit: ${{ steps.plan.outputs.rust_audit }}
      npm_audit: ${{ steps.plan.outputs.npm_audit }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The planner diffs the PR test merge against its first parent (or a
          # push's endpoints, fetching a missing one by ID): no history needed.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            scripts/ci
      - uses: ./.github/actions/plan-checks
        id: plan
        with:
          workflow: security
          token: ${{ github.token }}

  rustsec:
    needs: plan
    if: needs.plan.outputs.rust_audit == 'true'
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Scan locked dependencies
        run: |
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock

  npm-audit:
    needs: plan
    if: needs.plan.outputs.npm_audit == 'true'
    name: Browser test dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    needs: plan
    if: github.event_name == 'pull_request' && (needs.plan.outputs.rust_audit == 'true' || needs.plan.outputs.npm_audit == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: always

  result:
    name: Security result
    if: always()
    needs: [plan, rustsec, npm-audit, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tree ID still covers the whole commit.
          sparse-checkout: |
            .github
            scripts/ci
      - uses: ./.github/actions/finish-checks
        with:
          workflow: security
          results: ${{ toJSON(needs) }}
          selected: ${{ toJSON(needs.plan.outputs) }}
