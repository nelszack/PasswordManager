name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  # Preserve checks for earlier direct pushes; PR updates may cancel old PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      extension: ${{ steps.plan.outputs.extension }}
      browser: ${{ steps.plan.outputs.browser }}
      cloud: ${{ steps.plan.outputs.cloud }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      rust_audit: ${{ steps.plan.outputs.rust_audit }}
      npm_audit: ${{ steps.plan.outputs.npm_audit }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test CI selection and reuse safeguards
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Select suites or reuse successful PR result
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/plan.py --workflow security

  rustsec:
    needs: plan
    if: needs.plan.outputs.rust_audit == 'true'
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Scan locked dependencies
        run: |
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock

  npm-audit:
    needs: plan
    if: needs.plan.outputs.npm_audit == 'true'
    name: Browser test dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    needs: plan
    if: github.event_name == 'pull_request' && (needs.plan.outputs.rust_audit == 'true' || needs.plan.outputs.npm_audit == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: always

  result:
    name: Security result
    if: always()
    needs: [plan, rustsec, npm-audit, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/plan.py --workflow security --finish
      - name: Record the tested source tree
        env:
          SELECTED: ${{ toJSON(needs.plan.outputs) }}
        run: python3 scripts/ci/plan.py --workflow security --record
      - name: Upload successful source-tree proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-tested-tree
          path: tested-tree.json
          overwrite: true
          retention-days: 14
          if-no-files-found: error
