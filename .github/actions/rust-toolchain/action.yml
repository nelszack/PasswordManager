name: Rust toolchain
description: Install the toolchain and components pinned in rust-toolchain.toml.
inputs:
  targets:
    description: Extra comma-separated compilation targets
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Read pinned toolchain
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        components="$(sed -n 's/^components *= *\[\(.*\)\].*/\1/p' rust-toolchain.toml | tr -d '" ')"
        if [[ -z "$channel" ]]; then
          echo "rust-toolchain.toml must set channel = \"<version>\" on one line" >&2
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "components=$components" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # toolchain installer
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ steps.pin.outputs.components }}
        targets: ${{ inputs.targets }}
