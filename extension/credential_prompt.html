<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save Credentials</title>
  <link rel="stylesheet" href="credential_prompt.css">
</head>
<body>
  <main>
    <h1>Save Credentials</h1>
    <p id="site"></p>
    <p id="status">Loading…</p>
    <form id="credentials" hidden>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" maxlength="4096" required>
      <label id="usernameLabel" for="username">Username</label>
      <input id="username" name="username" type="text" maxlength="4096">
      <div id="actions">
        <button id="add" type="submit">Add as New Account</button>
        <button id="update" type="button">Update Existing</button>
        <button id="cancel" type="button">Ignore</button>
      </div>
    </form>
  </main>
  <script src="credential_prompt.js"></script>
</body>
</html>
