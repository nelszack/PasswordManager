<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save login · Password Manager</title>
  <link rel="stylesheet" href="common.css"><link rel="stylesheet" href="credential_prompt.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/icon32.png" alt="">
      <h1>Save this login?</h1>
    </header>
    <p id="site"></p>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <form id="credentials" hidden>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" maxlength="4096" required>
      <label id="usernameLabel" for="username">Username</label>
      <input id="username" name="username" type="text" maxlength="4096">
      <span class="label" id="passwordLabel">Password</span>
      <div class="password-row">
        <output id="passwordMask" aria-labelledby="passwordLabel"></output>
        <input id="password" type="text" maxlength="65536" autocomplete="off" spellcheck="false"
          aria-labelledby="passwordLabel" hidden>
        <button id="revealPassword" type="button" aria-controls="password">Show</button>
      </div>
      <p id="updateNote" class="hint" hidden></p>
      <button id="chooseOther" type="button" class="link" aria-expanded="false" aria-controls="chooser">
        Update a different saved login…
      </button>
      <div id="chooser" hidden>
        <label for="targetSearch">Find the saved login</label>
        <input id="targetSearch" type="search" maxlength="256" autocomplete="off" spellcheck="false"
          placeholder="Name, username or website">
        <ul id="targetResults" aria-label="Matching saved logins"></ul>
      </div>
      <div id="actions">
        <button id="add" type="submit" class="primary">Save as new login</button>
        <button id="update" type="button">Update saved login</button>
        <div class="secondary">
          <button id="cancel" type="button" title="Esc">Not now</button>
          <button id="never" type="button">Never for this site</button>
        </div>
      </div>
    </form>
    <button id="reviewOutcome" type="button" hidden>Check save outcome</button>
  </main>
  <script src="credential_prompt_runtime.js"></script>
</body>
</html>
