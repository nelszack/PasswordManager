<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Manager</title>
  <link rel="stylesheet" href="common.css"><link rel="stylesheet" href="picker.css">
    <script src="ui_transport.js"></script>
    <script src="ui_session.js" defer></script>
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/icon32.png" alt="">
      <h1 id="title">Password Manager</h1>
    </header>
    <p id="destination"></p>
    <label id="crossOriginWarning" class="card" hidden>
      <input id="confirmCrossOrigin" type="checkbox">
      <span id="crossOriginText"></span>
    </label>
    <input id="search" type="search" autocomplete="off" placeholder="Search" aria-label="Find an account"
      role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="items">
    <p id="status" class="hint" role="status" aria-live="polite">Loading…</p>
    <div id="items" role="listbox" aria-label="Saved items"></div>
    <div id="recovery" class="card" hidden><p>Unlock your vault in the desktop app. This window retries by itself once it is unlocked.</p><p class="hint">If this window expires, reopen it from the website.</p><button id="openDesktop" type="button" class="primary">Open desktop app</button><button id="retry" type="button">Retry now</button></div>
    <button id="cancel" type="button">Cancel <kbd>Esc</kbd></button>
  </main>
  <script src="picker_state.js"></script>
  <script src="picker.js"></script>
</body>
</html>
