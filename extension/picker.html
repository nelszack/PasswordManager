<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Manager</title>
  <link rel="stylesheet" href="common.css"><link rel="stylesheet" href="picker.css">
    <script src="ui_transport.js"></script>
    <script src="ui_session.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">Password Manager</h1>
    <p id="destination"></p>
    <label id="crossOriginWarning" hidden>
      <input id="confirmCrossOrigin" type="checkbox">
      <span id="crossOriginText"></span>
    </label>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <label>Find an account<input id="search" type="search" autocomplete="off"></label>
    <div id="items"></div>
    <div id="recovery" hidden><p>Open the desktop app to unlock your vault or configure browser integration.</p><p>After reconnecting, retry here. If this chooser expires, reopen it from the website.</p><button id="retry" type="button">Retry loading accounts</button></div>
    <button id="cancel" type="button">Cancel</button>
  </main>
  <script src="picker_state.js"></script>
  <script src="picker.js"></script>
</body>
</html>
