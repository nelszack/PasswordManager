<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Manager</title>
  <link rel="stylesheet" href="common.css"><link rel="stylesheet" href="picker.css">
    <script src="ui_transport.js"></script>
    <script src="ui_session.js" defer></script>
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/icon32.png" alt="">
      <h1 id="title">Password Manager</h1>
    </header>
    <p id="destination"></p>
    <label id="crossOriginWarning" class="card" hidden>
      <input id="confirmCrossOrigin" type="checkbox">
      <span id="crossOriginText"></span>
    </label>
    <input id="search" type="search" autocomplete="off" placeholder="Search" aria-label="Find an account" aria-controls="items">
    <p id="status" class="hint" role="status" aria-live="polite">Loading…</p>
    <div id="items" role="group" aria-label="Saved items"></div>
    <div id="recovery" class="card" hidden><p>Open the desktop app to unlock your vault or configure browser integration.</p><p class="hint">After reconnecting, retry here. If this window expires, reopen it from the website.</p><button id="retry" type="button" class="primary">Retry</button></div>
    <button id="cancel" type="button">Cancel <kbd>Esc</kbd></button>
  </main>
  <script src="picker_state.js"></script>
  <script src="picker.js"></script>
</body>
</html>
