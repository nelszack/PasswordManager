<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Password Manager</title>
  <link rel="stylesheet" href="common.css"><link rel="stylesheet" href="popup.css">
    <script src="ui_transport.js"></script>
    <script src="ui_session.js" defer></script>
</head>

<body>
  <header class="brand">
    <img src="icons/icon32.png" alt="">
    <h1>Password Manager</h1>
  </header>

  <div id="statusCard" class="card">
    <div id="statusRow" role="status" aria-live="polite">
      <span id="statusDot"></span>
      <strong id="statusText">Checking…</strong>
    </div>
    <p id="nativeHint" class="hint">Checking the local vault connection…</p>
  </div>

  <div class="actions">
    <button id="openDesktopBtn" class="primary">Open desktop app</button>
    <button id="lockBtn" disabled>Lock vault</button>
  </div>

  <section id="generator" class="card" aria-labelledby="generatorTitle">
    <h2 id="generatorTitle">Generate a password</h2>
    <div class="generated">
      <output id="genValue" aria-live="polite"></output>
      <button id="genNew" class="quiet" title="Generate another" aria-label="Generate another password">↻</button>
    </div>
    <button id="genCopy">Copy password</button>
    <label class="range">Length <span id="genLengthValue"></span>
      <input id="genLength" type="range" min="8" max="64" step="1">
    </label>
    <div class="toggles">
      <label><input id="genSymbols" type="checkbox"> Symbols</label>
      <label><input id="genPassphrase" type="checkbox"> Use words</label>
    </div>
    <p class="hint">These settings are also used by the ✨ button on sign-up forms.</p>
  </section>

  <details id="neverSave" hidden>
    <summary>Sites that never offer to save (<span id="neverCount">0</span>)</summary>
    <ul id="neverList"></ul>
  </details>

  <section id="recovery" class="card" hidden>
    <label for="operation">A previous change needs review</label>
    <select id="operation"></select>
    <button id="reviewOperation">Check outcome</button>
    <div id="unknownReview" hidden>
      <p>Inspect the vault in the desktop app before continuing.</p>
      <label><input id="inspected" type="checkbox"> I inspected the affected item</label>
      <button id="acknowledgeOperation" disabled>Acknowledge reviewed outcome</button>
    </div>
  </section>

  <div id="output" role="status" aria-live="polite"></div>

  <script src="password_generator.js"></script>
  <script src="popup_state.js"></script>
  <script src="popup.js"></script>
</body>

</html>
