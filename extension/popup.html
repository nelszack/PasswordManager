<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Password Manager</title>
  <link rel="stylesheet" href="common.css"><link rel="stylesheet" href="popup.css">
    <script src="ui_transport.js"></script>
    <script src="ui_session.js" defer></script>
</head>

<body>

  <h3>Password Manager</h3>

  <div id="statusRow" role="status" aria-live="polite">
    <span id="statusDot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <p id="nativeHint">Checking the local vault connection…</p>

  <button id="lockBtn" disabled>Lock Vault</button>
  <p>Open Password Manager on your desktop to unlock and edit your vault.</p>
  <section id="recovery" hidden>
    <label for="operation">A previous change needs review</label>
    <select id="operation"></select>
    <button id="reviewOperation">Check outcome</button>
    <div id="unknownReview" hidden>
      <p>Inspect the vault in the desktop app before continuing.</p>
      <label><input id="inspected" type="checkbox"> I inspected the affected item</label>
      <button id="acknowledgeOperation" disabled>Acknowledge reviewed outcome</button>
    </div>
  </section>

  <div id="output" role="status" aria-live="polite"></div>

  <script src="popup_state.js"></script>
  <script src="popup.js"></script>
</body>

</html>
