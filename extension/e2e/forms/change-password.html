<!doctype html>
<html><head><meta charset="utf-8"><title>Change password</title>
<style>body{font:16px system-ui;padding:60px} form{display:grid;gap:10px;width:340px} input{padding:10px}</style></head>
<body>
<form>
  <h1>Change password</h1>
  <input type="hidden" name="username" value="account">
  <label for="current">Current password</label>
  <input id="current" type="password" name="currentPassword" autocomplete="current-password" data-expect="login">
  <label for="next">New password</label>
  <input id="next" type="password" name="newPassword" data-expect="generate">
  <label for="repeat">Repeat new password</label>
  <input id="repeat" type="password" name="repeatPassword" data-expect="generate">
  <button>Update password</button>
</form>
</body></html>
