<!doctype html>
<html><head><meta charset="utf-8"><title>Embedded sign-in</title>
<style>body{font:16px system-ui;padding:16px} form{display:grid;gap:8px} input{padding:8px}</style></head>
<body>
<form>
  <label for="login">Login</label><input id="login" name="login" data-expect="login">
  <label for="pw">Password</label><input id="pw" name="pw" type="password" data-expect="login">
  <button>Sign in</button>
</form>
</body></html>
