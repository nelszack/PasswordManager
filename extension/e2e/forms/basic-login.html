<!doctype html>
<html><head><meta charset="utf-8"><title>Basic login with header search</title>
<style>body{font:16px system-ui;margin:0} header{display:flex;gap:8px;padding:8px;background:#eee}
main{max-width:360px;margin:40px auto;display:grid;gap:12px} input{padding:8px;font-size:16px}</style></head>
<body>
<header><input type="search" name="q" placeholder="Search products" data-expect=""></header>
<main>
  <form action="/session" method="post">
    <label for="user">Username</label>
    <input id="user" name="username" autocomplete="username" data-expect="login">
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" data-expect="login">
    <label><input type="checkbox" name="remember"> Remember me</label>
    <button>Sign in</button>
  </form>
</main>
</body></html>
