[package]
name = "password_manager"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pm"
path = "src/main.rs"

[features]
default = ["desktop"]
fuzzing = []
desktop = ["dep:iced", "dep:rfd"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
rand = "0.10"
zxcvbn = { version = "3", default-features = false }
arboard = { version = "3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
rpassword = "7.5"
zeroize = { version = "1.7", features = ["derive"] }
rmp-serde = "1"
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
blake3 = { version = "1.5", features = ["zeroize"] }
hex = "0.4"
psl = "2"
url = "2"
chrono = "0.4"
csv = "1"
serde_json = "1"
sha1 = "0.11"
tempfile = "3"
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
subtle = "2"
totp-rs = { version = "6", default-features = false, features = ["otpauth", "zeroize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "form"] }
base64 = "0.23"
aws-lc-rs = "1.18"
pem-rfc7468 = { version = "1.0", features = ["alloc"] }
html-escape = "0.3"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "crisp", "advanced"], optional = true }
rfd = { version = "0.17.2", optional = true }

[dev-dependencies]
proptest = "1"

[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
iced_winit = { path = "vendor/iced_winit" }
fontdb = { path = "vendor/fontdb-compat" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.1", default-features = false, features = ["tokio", "proxy"] }
futures-lite = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSDate", "NSNotification", "NSDistributedNotificationCenter", "NSRunLoop", "NSString", "NSOperation"] }
