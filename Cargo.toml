[package]
name = "password_manager"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rand = "0.10"
zxcvbn = "3"
arboard = "3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
rpassword = "7.5"
zeroize = { version = "1.7", features = ["derive"] }
rmp-serde = "1"
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
blake3 = "1.5"
hex = "0.4"
psl = "2"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
subtle = "2"
totp-rs = { version = "6", default-features = false, features = ["otpauth", "zeroize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
