[package]
name = "pm-platform"
version.workspace = true
edition = "2024"
publish = false

[features]
clipboard = ["dep:arboard"]
fixtures = []

[dependencies]
directories = "6"
tempfile = "3"
zeroize = "1.7"
arboard = { version = "3", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }
