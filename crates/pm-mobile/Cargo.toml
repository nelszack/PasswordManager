[package]
name = "pm-mobile"
version.workspace = true
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
password_manager = { path = "../..", default-features = false }
serde_json = "1"
zeroize = "1.7"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"
