[package]
name = "pm-client"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
pm-contracts = { path = "../pm-contracts" }
pm-platform = { path = "../pm-platform" }
rmp-serde = "1"
serde_json = "1"
zeroize = "1.7"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
