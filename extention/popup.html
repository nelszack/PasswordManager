<!DOCTYPE html>
<html>

<head>
  <title>Password Manager</title>
  <style>
    body {
      font-family: Arial;
      width: 250px;
      padding: 10px;
    }

    button {
      width: 100%;
      margin-top: 5px;
      padding: 8px;
    }

    #statusRow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 6px 0 10px 0;
      font-size: 13px;
    }

    #statusDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b7280;
      display: inline-block;
    }

    #output {
      margin-top: 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <h3>Password Manager</h3>

  <div id="statusRow">
    <span id="statusDot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <label for="tokenInput" style="font-size: 12px;">Session token (from the file printed by <code>pm start</code>):</label>
  <input id="tokenInput" type="password" autocomplete="off" style="width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px;" />
  <button id="saveTokenBtn">Save Token</button>

  <button id="lockBtn">Lock Vault</button>

  <div id="output"></div>

  <script src="popup.js"></script>
</body>

</html>
